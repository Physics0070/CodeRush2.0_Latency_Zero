version: 1

services:
  # FastAPI backend, native Python - no Dockerfile, no ollama binary on this
  # box. Model calls go out to Ollama Cloud (or a tunnelled dev instance) over
  # HTTP; Render has no GPU and not enough RAM to run inference itself.
  # The frontend is a separate Netlify deploy - not defined here, so this is
  # the only service in this file.
  - type: web
    name: aco-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Unpinned, Render falls back to its own default version, which is not
      # necessarily the 3.11.9 this was built and tested against - matters
      # here because turso-serverless is a young Beta package and may not
      # ship a wheel for whatever Render would otherwise pick. Verified
      # against Render's own docs: PYTHON_VERSION must be fully qualified.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: ollama
      # https://ollama.com is Ollama Cloud's base URL - the adapter appends
      # /api/chat itself (verified against Ollama's own docs, no /v1 suffix
      # needed). Point this at a tunnelled local instance instead for a
      # non-cloud deploy.
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      # Cloud-only tags (":cloud" suffix) - local tags have no weights on this
      # box. Comma-separated, no "ollama:" prefix.
      - key: OLLAMA_MODELS
        value: "qwen3-coder:480b-cloud,gpt-oss:120b-cloud"
      - key: MAX_CONCURRENT_MODEL_CALLS
        value: "4"
      # Exact origin of the deployed Netlify frontend. Netlify preview
      # subdomains are matched separately, in code, by .netlify.app suffix -
      # see backend/main.py.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
