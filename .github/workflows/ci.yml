name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no .env is tracked
        run: |
          git ls-files --error-unmatch .env 2>/dev/null && { echo "::error::.env is tracked"; exit 1; }
          echo "ok: .env is not tracked"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Best effort. download.pytorch.org stalls or refuses connections often
      # enough that a hard dependency on it turns an unrelated network problem
      # into a red build. When it does not install, the embedding-backed tests
      # skip themselves and metrics report embeddings_available: false.
      - name: Install optional embeddings
        continue-on-error: true
        run: |
          pip install --retries 5 --timeout 60 -r requirements-embeddings.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

      # Audits the declared requirements rather than the environment. A `+cpu`
      # torch build is absent from PyPI and --strict fails on anything it
      # cannot look up, so auditing the installed set would fail on a package
      # that is optional anyway.
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict --desc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
